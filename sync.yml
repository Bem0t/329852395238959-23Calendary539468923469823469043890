name: Sync calendar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download calendar
        env:
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
        run: |
          URL="${CALENDAR_URL/webcal:\/\//https://}"
          curl -fsSL "$URL" -o calendar.ics
          grep -q "BEGIN:VCALENDAR" calendar.ics

      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add calendar.ics
          git diff --cached --quiet || (git commit -m "Update calendar" && git push)
