name: Sync calendar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download calendars
        env:
          URL1: ${{ secrets.CALENDAR_URL }}
          URL2: ${{ secrets.CALENDAR_URL_2 }}
        run: |
          fetch() {
            url="${1/webcal:\/\//https://}"
            curl -fsSL "$url" -o "$2"
            grep -q "BEGIN:VCALENDAR" "$2"
          }
          fetch "$URL1" calendar.ics
          if [ -n "$URL2" ]; then fetch "$URL2" calendar2.ics; fi

      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add calendar*.ics
          git diff --cached --quiet || (git commit -m "Update calendar" && git push)
